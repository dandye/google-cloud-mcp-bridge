[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-mcp-bridge"
version = "0.1.0"
description = "Google Cloud Remote MCP Agent Bridge using Google Agent Development Kit (ADK)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dan Dye", email = "dandye@google.com" }
]
dependencies = [
    "google-adk[mcp,gcp]>=0.1.0",
    "google-auth>=2.29.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
google-cloud-mcp-bridge = "manage:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gcp_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests against deployed Agent Engine",
]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gcp_agent.*"]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # bandit security checks
]
ignore = [
    "E501",  # line too long
    "B904",  # raise from within except
    "B007",  # loop control variable not used
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
"scripts/**/*.py" = ["S603", "S607"]
"manage.py" = ["S603", "S104"]
"gcp_agent/**/*.py" = ["UP", "I", "S", "C4", "E501"]
"test_*.py" = ["UP", "I", "S", "F401", "E501"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
